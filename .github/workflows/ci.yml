name: ci
on: [push, pull_request]
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DTENSORTRANSIT_BUILD_CUDA=OFF
      - run: cmake --build build -j2
      - run: ctest --test-dir build --output-on-failure
      - run: ./build/tensortransit_info
      # The planner tests use always-on checks, so a Release build must still test.
      - run: cmake -S . -B build-release -DTENSORTRANSIT_BUILD_CUDA=OFF -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build-release -j2
      - run: ctest --test-dir build-release --output-on-failure

  package:
    # TensorTransit is embedded by a runtime, so "it builds" is not the bar: the installed
    # package has to be consumable by an outside project via find_package -- under BOTH the
    # current name and the deprecated 0.1 one, for as long as the shim is promised.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DTENSORTRANSIT_BUILD_CUDA=OFF && cmake --build build -j2
      - run: cmake --install build --prefix "$PWD/prefix"
      - name: consume the installed package under the current name
        run: |
          mkdir -p /tmp/consumer-tt
          cat > /tmp/consumer-tt/CMakeLists.txt <<'CM'
          cmake_minimum_required(VERSION 3.24)
          project(ConsumerTT LANGUAGES CXX)
          find_package(TensorTransit 0.2 REQUIRED)
          add_executable(consumer main.cpp)
          target_link_libraries(consumer PRIVATE TensorTransit::tensortransit)
          CM
          cat > /tmp/consumer-tt/main.cpp <<'CPP'
          #include <tensortransit/runtime.h>
          #include <cstdio>
          int main() {
              tensortransit::TransitRuntime rt;
              tensortransit::TransitPlannerConfig cfg;
              if (!rt.set_planner("budgeted", cfg)) return 1;
              std::printf("%s %s\n", tensortransit::version_string(), rt.planner()->name());
          }
          CPP
          cmake -S /tmp/consumer-tt -B /tmp/consumer-tt/build -DCMAKE_PREFIX_PATH="$PWD/prefix"
          cmake --build /tmp/consumer-tt/build -j2
          /tmp/consumer-tt/build/consumer

      - name: consume the installed package
        run: |
          mkdir -p /tmp/consumer
          cat > /tmp/consumer/CMakeLists.txt <<'CM'
          cmake_minimum_required(VERSION 3.24)
          project(ConsumerSmoke LANGUAGES CXX)
          find_package(RecurLocal 0.1 REQUIRED)
          add_executable(consumer main.cpp)
          target_link_libraries(consumer PRIVATE RecurLocal::recurlocal)
          CM
          cat > /tmp/consumer/main.cpp <<'CPP'
          #include <recurlocal/planner.h>
          #include <recurlocal/version.h>
          #include <cstdio>
          int main() {
              recurlocal::PlannerConfig cfg;
              if (recurlocal::validate(cfg)) return 1;
              recurlocal::LocalityPlanner p({96u<<20, 64u<<20, 32u<<20}, cfg);
              std::printf("RecurLocal %s window=%zu\n", recurlocal::version_string(),
                          p.plan_for_layer(3u<<20, true).hot_window_bytes);
              return 0;
          }
          CPP
          cmake -S /tmp/consumer -B /tmp/consumer/build -DCMAKE_PREFIX_PATH="$PWD/prefix"
          cmake --build /tmp/consumer/build -j2
          /tmp/consumer/build/consumer

  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m compileall -q eval/ tools/tt-frontier
      - name: the frontier scorer's golden tests
        # The scoring math IS the ruler. A change to normalization, dominance, hypervolume,
        # aggregation or the receipt's status derivation silently redefines every past
        # receipt, so it has to be a build failure and not a review question.
        run: python3 eval/test_frontier.py
      - name: every frozen generation still loads and still hashes
        run: |
          python3 - <<'PY'
          import pathlib, subprocess, sys
          found = sorted(pathlib.Path("eval/generations").glob("*/generation.json"))
          assert found, "no TTF generation is defined"
          for path in found:
              r = subprocess.run([sys.executable, "tools/tt-frontier", "generation", "show",
                                  path.parent.name], capture_output=True, text=True)
              assert r.returncode == 0, r.stderr
              print(r.stdout.splitlines()[1])
          PY
      - name: the cost model still fits the measurements it claims to
        # The fitted constants live in a header and the measurements live in results/. A
        # change to either that made the model stop beating the linear one would otherwise
        # be invisible until somebody re-read the file.
        run: python3 eval/cost_model_fit.py
      - name: pin.json describes a real integration
        run: |
          python3 - <<'PY'
          import json, pathlib, re
          pin = json.load(open("adapters/sparkinfer/pin.json"))
          assert re.fullmatch(r"[0-9a-f]{40}", pin["commit"]), "the runtime commit must be pinned"
          patch = pathlib.Path("adapters/sparkinfer") / pin["patch"]
          assert patch.exists(), f"{patch} is missing"
          body = patch.read_text()
          # The hook is specified to add lines and remove none. A patch that deletes
          # SparkInfer code is a fork, and a fork cannot be reapplied to a moving upstream.
          removed = [l for l in body.splitlines()
                     if l.startswith("-") and not l.startswith("---")]
          assert not removed, f"the hook patch deletes {len(removed)} line(s): {removed[:3]}"
          print(f"pin ok: {pin['commit'][:12]}, {patch.name} insertion-only")
          PY
      - run: pip install --quiet jsonschema
      - name: validate JSON assets
        run: |
          python3 - <<'PY'
          import json, jsonschema
          for f in ("repo-manifest.json", "configs/qwen3.8-27b-feasibility.json",
                    "configs/rtx5090-section44-ceiling.json",
                    "configs/qwen3.6-35b-a3b-moe-ceiling.json"):
              json.load(open(f))
          for schema in ("eval/result_schema.json", "eval/real_result_schema.json"):
              jsonschema.Draft202012Validator.check_schema(json.load(open(schema)))
          # The committed real result is the input to the go/no-go gate, so it has to keep
          # matching the schema that pins it - and it has to keep scoring.
          import pathlib, subprocess, sys
          schema = jsonschema.Draft202012Validator(json.load(open("eval/real_result_schema.json")))
          for name in ("results/rtx5090-real.json", "results/rtx5090-real-complete.json"):
              real = pathlib.Path(name)
              if not real.exists():
                  continue
              doc = json.load(real.open())
              scored = doc.get("scored_result", doc)
              if "workloads" not in scored:
                  continue
              schema.validate(scored)
              json.dump(scored, open("/tmp/real.json", "w"))
              r = subprocess.run([sys.executable, "eval/decide.py", "--real", "/tmp/real.json"],
                                 capture_output=True, text=True)
              print(f"-- {name}"); print(r.stderr.strip()[:500])
          print("json assets ok")
          PY
      - name: the ceiling still computes
        # The ceiling decides whether competing here is worth anyone's time, and it is
        # derived from decide.py's weights and bands. A change to either that silently
        # stopped the ceiling computing would leave the claim standing with nothing behind it.
        run: |
          python3 eval/traffic_budget.py --matrix configs/rtx5090-section44-ceiling.json \
                                         --bandwidth-gbs 1792 > /dev/null
          # The second model's ceiling is what says the persist family is not bounded out
          # everywhere, so it has to keep computing too - including the per-arm persist bound,
          # which is the number that differs between the two models.
          python3 eval/traffic_budget.py --matrix configs/qwen3.6-35b-a3b-moe-ceiling.json \
                                         --bandwidth-gbs 1792 \
                                         --persisting-l2-bytes 62914560 > /dev/null

  cuda-build:
    # Device-less compile gate. Untrusted performance PRs must not reach a GPU host
    # (see SECURITY.md), so nvcc compilation is the CUDA check that can run here.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends nvidia-cuda-toolkit
      - run: nvcc --version
      # sm_80 keeps this buildable with the distro toolkit; sm_120 needs CUDA 12.8+.
      - run: cmake -S . -B build-cuda -DTENSORTRANSIT_BUILD_CUDA=ON -DCMAKE_CUDA_ARCHITECTURES=80
      - run: cmake --build build-cuda -j2
      - run: ctest --test-dir build-cuda --output-on-failure

  anti-gaming:
    # The property that a submission cannot win by editing the ruler is enforced by a script,
    # and a script nothing runs is a rule that holds only for honest submissions.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: run_from_base.sh overlays the instrument and reports what was changed
        run: |
          set -euo pipefail
          BASE="$(git rev-parse HEAD)"
          git worktree add -f /tmp/submission "$BASE"
          # A submission that quietly relaxes a guard, moves the runtime pin, and edits a
          # frozen generation. All three must be discarded AND named.
          sed -i 's/^MIN_COMPLETED_TOKEN_SHARE = 0.90/MIN_COMPLETED_TOKEN_SHARE = 0.10/'               /tmp/submission/eval/real_eval.py
          python3 - <<'PY'
          import json, pathlib
          pin = pathlib.Path("/tmp/submission/adapters/sparkinfer/pin.json")
          doc = json.load(pin.open()); doc["commit"] = "0" * 40
          pin.write_text(json.dumps(doc))
          gen = pathlib.Path("/tmp/submission/eval/generations/TTF-1/generation.json")
          if gen.exists():
              d = json.load(gen.open()); d["cell_floor"] = 1.0
              gen.write_text(json.dumps(d))
          PY
          OUT="$(bash eval/run_from_base.sh "$BASE" /tmp/submission -- --help 2>&1)"
          echo "$OUT"
          echo "$OUT" | grep -q "eval/real_eval.py" || { echo "::error::the evaluator edit was not reported"; exit 1; }
          echo "$OUT" | grep -q "pin.json"          || { echo "::error::the pin move was not reported"; exit 1; }
          echo "$OUT" | grep -q "generation.json"   || { echo "::error::the generation edit was not reported"; exit 1; }
          # And the overlaid copy must be the BASE's, not the submission's.
          grep -q "usage: real_eval.py" <<<"$OUT" || { echo "::error::the base evaluator did not run"; exit 1; }
          echo "anti-gaming overlay ok"
      - name: the trusted runner refuses a worker carrying a secret
        run: |
          set -euo pipefail
          if SSH_AUTH_SOCK=/tmp/fake-agent bash scripts/trusted_eval.sh                --candidate HEAD --model /dev/null 2>&1 | grep -q "SSH_AUTH_SOCK is set"; then
            echo "refusal ok"
          else
            echo "::error::trusted_eval.sh ran with a credential in scope"; exit 1
          fi
